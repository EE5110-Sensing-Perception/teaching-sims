[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teaching-sims"
version = "0.4.0"
description = "Interactive Dear PyGui teaching simulations for radar and IMU/navigation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Teaching Sims" }]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
  "dearpygui>=1.11",
  "matplotlib>=3.7",
  "PySide6>=6.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
teaching-sims = "teaching_sims.ui.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
